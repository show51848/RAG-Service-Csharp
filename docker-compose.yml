services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      # 設定敏感的環境變數（覆寫 appsettings.json）
      # 對應 Python 版的 .env 檔案機制
      - AppSettings__SecretKey=${SECRET_KEY}
      - AppSettings__AnthropicApiKey=${ANTHROPIC_API_KEY}
      - AppSettings__AppEnv=production
      - AppSettings__AllowedOrigins__0=${ALLOWED_ORIGIN:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
      - ./models:/app/models:ro  # ONNX 模型掛載為唯讀
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC（C# SDK 使用這個 port）
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
  qdrant_data:
